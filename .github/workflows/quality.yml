name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:ui
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check style samples on pull requests
        if: github.event_name == 'pull_request'
        run: python 代码/liuguang/tests/check_styleguide.py
      - name: Run two-account connection journey on pull requests
        if: github.event_name == 'pull_request'
        run: python 代码/liuguang/tests/check_connection.py
      - name: Run all browser journeys on main
        if: github.ref == 'refs/heads/main'
        run: pnpm test:e2e
